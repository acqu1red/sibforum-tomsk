include /etc/nginx/project/nginx-performance.conf;

map "${PUBLIC_SUBMISSIONS_ENABLED}" $public_submissions_enabled {
    default 0;
    "1" 1;
}

map "${PUBLIC_VOTING_ENABLED}" $public_voting_enabled {
    default 0;
    "1" 1;
}

map "${PUBLIC_ASSET_BASE_URL}" $public_assets_enabled {
    default 1;
    "" 0;
}

# Personal links contain a bearer token in the query string. Do not log it,
# or the Referer header that may contain the same link.
log_format forum '$remote_addr - $remote_user [$time_local] '
                 '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                 '"$http_user_agent"';

server {
    listen 80;
    access_log /var/log/nginx/access.log forum;
    server_name ${DOMAIN} ${ADMIN_DOMAIN};
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    access_log /var/log/nginx/access.log forum;
    http2 on;
    server_name ${DOMAIN};
    root /usr/share/nginx/html/site;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /promtour { return 308 /$is_args$args; }
    location = /promtour/ { return 308 /$is_args$args; }
    location = /promtour/index.html { return 308 /$is_args$args; }

    location = /promtour/contest.html {
        return 301 /contest/$is_args$args;
    }

    location = /admin {
        return 404;
    }

    location ^~ /admin/ {
        return 404;
    }

    location ^~ /api/v1/admin/ {
        return 404;
    }

    include /etc/nginx/project/nginx-submissions.conf;

    # These legacy forms save demo registrations in the browser.
    location = /esg2026/register.html {
        charset utf-8;
        default_type text/plain;
        return 503 "Регистрация на этот форум пока недоступна.\n";
    }

    location = /esg2026/my.html {
        charset utf-8;
        default_type text/plain;
        return 503 "Личный кабинет этого форума пока недоступен.\n";
    }

    location /static/ {
        alias /usr/share/nginx/html/static/;
    }

    location ^~ /img/ {
        if ($public_assets_enabled = 1) { return 302 ${PUBLIC_ASSET_BASE_URL}$uri; }
        try_files $uri =404;
    }

    location /media/ {
        alias /usr/share/nginx/html/media/;
    }

    location /api/v1/ {
        include /etc/nginx/project/nginx-proxy.conf;
    }

    location = /deployment-config.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"submissions_enabled":$public_submissions_enabled,"voting_enabled":$public_voting_enabled}';
    }

    # Legacy endpoints belong to the local prototype only.
    location /api/ {
        return 404;
    }

    include /etc/nginx/project/nginx-assets.conf;

    location ~ /\. {
        return 404;
    }

    location ~* /(?:README|SOURCES)\.md$ {
        return 404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl;
    access_log /var/log/nginx/access.log forum;
    http2 on;
    server_name ${ADMIN_DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Several gallery images may be saved together; each image is validated at 10 MB.
    client_max_body_size 64m;

    location ^~ /admin/site-editor/preview/ {
        include /etc/nginx/project/nginx-proxy.conf;
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    include /etc/nginx/project/nginx-submissions.conf;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /sitemap.xml {
        return 404;
    }

    location = / {
        return 302 /admin/;
    }

    location /static/ {
        alias /usr/share/nginx/html/static/;
    }

    location /media/ {
        alias /usr/share/nginx/html/media/;
    }

    location / {
        include /etc/nginx/project/nginx-proxy.conf;
    }
}
