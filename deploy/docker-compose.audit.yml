name: sibforum-audit
services:
  backend:
    image: siberianforum-backend:deploycheck
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py loaddata /catalog.json && gunicorn config.wsgi:application --bind 0.0.0.0:8100 --workers 2 --threads 2 --access-logfile /dev/null"
    environment:
      DEBUG: "1"
      SECRET_KEY: isolated-local-audit-not-a-production-secret
      SQLITE_PATH: /data/audit.sqlite3
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,host.docker.internal
      ADMIN_DOMAIN: admin.localhost
      SECURE_SSL_REDIRECT: "0"
      ADMIN_TOTP_REQUIRED: "0"
      CSRF_TRUSTED_ORIGINS: http://localhost:8097,http://admin.localhost:8097,http://after
    volumes:
      - ../backend:/app:ro
      - ./catalog.json:/catalog.json:ro
      - audit-data:/data
      - audit-static:/app/staticfiles
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8100/api/v1/health/')"]
      interval: 3s
      retries: 20
  before:
    image: nginx:alpine
    ports: ["127.0.0.1:8096:80"]
    volumes:
      - ${AUDIT_BASELINE_DIR:?Set AUDIT_BASELINE_DIR}:/site:ro
      - ./nginx.audit.baseline.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
    depends_on:
      backend:
        condition: service_healthy
  after:
    image: nginx:alpine
    ports: ["127.0.0.1:8097:80"]
    volumes:
      - ../site:/site:ro
      - ./nginx.audit.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-performance.conf:/etc/nginx/conf.d/performance.conf:ro
      - ./nginx-assets.conf:/etc/nginx/project/nginx-assets.conf:ro
      - audit-static:/static:ro
    mem_limit: 64m
    depends_on:
      backend:
        condition: service_healthy
volumes:
  audit-data:
  audit-static:
