server {
    listen 80;
    server_name localhost;
    root /site;
    index index.html;
    location /static/ { alias /static/; }
    location /admin/ {
        proxy_pass http://backend:8100;
        proxy_set_header Host admin.localhost;
    }
    location ^~ /api/v1/admin/ {
        proxy_pass http://backend:8100;
        proxy_set_header Host admin.localhost;
    }
    location = /deployment-config.json {
        default_type application/json;
        add_header Cache-Control no-store;
        return 200 '{"submissions_enabled":0}';
    }
    location /api/v1/ {
        proxy_pass http://backend:8100;
        proxy_set_header Host localhost;
    }
    include /etc/nginx/project/nginx-assets.conf;
    location / { try_files $uri $uri/ =404; }
}
