# Registration still needs real email delivery. Voting has its own switch.
location ~ ^/api/v1/registrations/(?:submit|verify)/$ {
    if ($public_submissions_enabled = 0) {
        return 503 '{"ok":false,"error":"submissions_unavailable","message":"Приём заявок временно недоступен. Попробуйте позже."}';
    }
    default_type application/json;
    charset utf-8;
    include /etc/nginx/project/nginx-proxy.conf;
}
location ~ ^/api/v1/contests/[^/]+/ballots/(?:verify/)?$ {
    if ($public_voting_enabled = 0) {
        return 503 '{"ok":false,"error":"voting_unavailable","message":"Голосование временно недоступно. Попробуйте позже."}';
    }
    default_type application/json;
    charset utf-8;
    include /etc/nginx/project/nginx-proxy.conf;
}
