# Public POST endpoints are closed until SMTP and SmartCaptcha are configured.
# Apply on both hosts, so the admin host cannot bypass the staging switch.
location ~ ^/api/v1/(?:registrations/(?:submit|verify)/|contests/[^/]+/ballots/(?:verify/)?)$ {
    if ($public_submissions_enabled = 0) {
        return 503 '{"ok":false,"error":"submissions_unavailable","message":"Приём заявок и голосование временно недоступны. Попробуйте позже."}';
    }
    default_type application/json;
    charset utf-8;
    include /etc/nginx/project/nginx-proxy.conf;
}
