# HTTP is used only for ACME until the first certificate exists.
server {
    listen 80;
    server_name ${DOMAIN} ${ADMIN_DOMAIN};

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        add_header Retry-After 300 always;
        return 503 "The website is being prepared. Please return shortly.\n";
    }
}
