# Only static source directories: media and authenticated ticket URLs are excluded.
location ~* ^/(?:css|js|img|fonts|promtour|esg2026)/.+\.(?:css|js|woff2|png|jpe?g|webp|svg|ico)$ {
    try_files $uri =404;
    expires 1h;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options nosniff always;
}
