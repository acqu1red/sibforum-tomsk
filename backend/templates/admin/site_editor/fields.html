{% for field in fields %}{% if field.is_hidden %}{{ field }}{% else %}<div class="editor-field{% if field.errors %} has-error{% endif %}{% if field.field.widget.input_type == 'checkbox' %} editor-check{% endif %}" data-field="{{ field.name }}">{{ field.label_tag }}{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{{ field.errors }}</div>{% endif %}{% endfor %}
