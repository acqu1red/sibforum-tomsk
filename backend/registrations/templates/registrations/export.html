<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f6fb; color: #0e1330; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 860px; margin: 30px auto; padding: 20px; }
    section { padding: 24px; border: 1px solid #d9dceb; border-radius: 16px; background: #fff; }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { color: #4a5070; }
    form { display: grid; gap: 16px; margin-top: 24px; }
    label { display: grid; gap: 6px; font-weight: 600; }
    select { width: 100%; min-height: 46px; padding: 8px; border: 1px solid #9ba3bf; border-radius: 8px; background: #fff; font: inherit; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
    button { min-height: 48px; padding: 12px 18px; border: 0; border-radius: 8px; background: #3f4fb5; color: #fff; font-weight: 700; cursor: pointer; }
    button.secondary { background: #ecedf7; color: #33419e; }
    .note { padding: 14px; border-radius: 10px; background: #ecedf7; }
  </style>
</head>
<body>
<main>
  <section>
    <h1>{{ title }}</h1>
    <p>Форум: <b>{{ forum.title }}</b></p>
    <p class="note">Выгрузки доступны только сотрудникам и записываются в журнал. «По событиям» — строка на событие участника, «Сводка по людям» — строка на человека со всеми его событиями.</p>
    <form method="get">
      <label>Событие
        <select name="event">
          <option value="">Все события</option>
          {% for event in events %}<option value="{{ event.id }}" {% if filters.event == event.id|stringformat:'s' %}selected{% endif %}>{{ event.day.title }} · {{ event.start_time|time:'H:i' }} · {{ event.title }}</option>{% endfor %}
        </select>
      </label>
      <label>Статус
        <select name="status">
          <option value="">Все статусы</option>
          {% for value,label in statuses %}<option value="{{ value }}" {% if filters.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
        </select>
      </label>
      <label>Представление
        <select name="mode">
          <option value="items" {% if filters.mode == 'items' %}selected{% endif %}>По событиям участников</option>
          <option value="summary" {% if filters.mode == 'summary' %}selected{% endif %}>Сводка по людям</option>
        </select>
      </label>
      <div class="actions">
        <button type="submit" name="format" value="xlsx">Скачать XLSX</button>
        <button type="submit" name="format" value="csv" class="secondary">Скачать CSV</button>
      </div>
    </form>
  </section>
</main>
</body>
</html>
